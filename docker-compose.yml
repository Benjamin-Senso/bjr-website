# Deployed via Dokploy as a Docker Compose application.
#
# No ports are published to the host: Dokploy's Traefik reaches the container
# over the shared `dokploy-network`, and TLS plus the domain are configured in
# the Dokploy UI (Domains tab: service `web`, container port 3000). Publishing
# 3000 here would expose the app directly, bypassing Traefik and its certificate.
services:
  web:
    build: .
    image: bjr-website
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      # Required. A long random string. Set these in Dokploy's Environment tab
      # rather than a .env file on the host.
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in Dokploy}
      # The public origin, e.g. https://benjaminrutter.com. Read server-side to
      # make OG image URLs absolute and to build the sitemap.
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set NEXT_PUBLIC_SERVER_URL in Dokploy}
      # Optional. Without both, /writing stays hidden from the nav.
      BEEHIIV_API_KEY: ${BEEHIIV_API_KEY:-}
      BEEHIIV_PUBLICATION_ID: ${BEEHIIV_PUBLICATION_ID:-}
      # Cloudflare R2 for media (optional). With all four set, uploads go to R2
      # instead of the volume, which leaves only the SQLite file on disk.
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # SMTP for forwarding contact form messages (optional). Without it,
      # messages are still stored in the CMS under Messages.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Benjamin Rutter}
      # Postgres connection string. Dokploy supplies this when a database is
      # attached to the app; set it explicitly in the Environment tab otherwise.
      DATABASE_URI: ${DATABASE_URI:?set DATABASE_URI in Dokploy}
      MEDIA_DIR: /app/data/media
    volumes:
      # Uploaded media when R2 is not configured. Content itself lives in
      # Postgres, so this is only needed for local-disk uploads.
      - bjr-data:/app/data
    networks:
      - dokploy-network

volumes:
  bjr-data:

networks:
  dokploy-network:
    external: true
